<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1B1E"/>
      <stop offset="50%" stop-color="#101114"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Glass Surface Specular Gradient -->
    <linearGradient id="glass-specular" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.00"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Edge Highlight Stroke -->
    <linearGradient id="rim-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Monogram Metallic / Crisp Fill -->
    <!-- userSpaceOnUse: the F's two bars are perfectly horizontal, so their
         bounding box has zero height and an objectBoundingBox gradient is
         degenerate — the spec then drops the element entirely. Absolute
         coordinates over the mark's bbox also keep one continuous sheen
         across the whole mark instead of restarting it per path. -->
    <linearGradient id="mark-grad" x1="157" y1="143" x2="382" y2="368" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F4F4F6"/>
      <stop offset="100%" stop-color="#D2D4D8"/>
    </linearGradient>

    <!-- Subtle Accent Glow (Drive Red / Progress Green) -->
    <radialGradient id="ambient-glow" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FB2C36" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="mark-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Squircle Base (iOS standard 512px canvas, radius 115) -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bg-base)"/>

  <!-- Ambient Light Reflection -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#ambient-glow)"/>

  <!-- Liquid Glass Overlay -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#glass-specular)"/>

  <!-- Crisp Top Rim Highlight -->
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="url(#rim-stroke)" stroke-width="3"/>

  <!-- Central Kinetic 'F' + Pulse + Trend Vector Mark -->
  <g filter="url(#mark-shadow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Bar of 'F' with tapered end -->
    <path d="M 170 156 L 332 156" 
          stroke="url(#mark-grad)" 
          stroke-width="26"/>

    <!-- Mid Connector / Bar -->
    <path d="M 170 236 L 270 236" 
          stroke="url(#mark-grad)" 
          stroke-width="24"/>

    <!-- Dynamic Pulse Vector (Stem that triggers an ascending pulse trend) -->
    <path d="M 170 156 
             L 170 340 
             L 218 340 
             L 252 278 
             L 288 356 
             L 326 294 
             L 348 318" 
          fill="none" 
          stroke="url(#mark-grad)" 
          stroke-width="24"/>

    <!-- Data Drive / Accent Signal Dot (Drive Red #FB2C36) -->
    <circle cx="372" cy="292" r="10" fill="#FB2C36"/>
  </g>
</svg>
